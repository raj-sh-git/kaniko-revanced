name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Vet & Format Check
        run: |
          go vet ./pkg/... ./cmd/...
          test -z "$(gofmt -l pkg/ cmd/)" || (echo "Unformatted files found:" && gofmt -l pkg/ cmd/ && exit 1)

      - name: Run Unit Tests
        run: |
          mkdir -p out
          go test -v -cover -coverprofile=out/coverage.out -timeout 180s ./pkg/... ./cmd/...

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: out/coverage.out
          retention-days: 7

  build-check:
    name: Multi-Arch Build Verification
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target:
          - kaniko-executor
          - kaniko-debug
          - kaniko-slim
          - kaniko-warmer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Target (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
