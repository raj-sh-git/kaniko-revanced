name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Vet & Format Check
        run: |
          go vet ./pkg/... ./cmd/...
          test -z "$(gofmt -l pkg/ cmd/)" || (echo "Unformatted files found:" && gofmt -l pkg/ cmd/ && exit 1)

      - name: Run Unit Tests
        run: |
          mkdir -p out
          go test -v -cover -coverprofile=out/coverage.out -timeout 180s ./pkg/... ./cmd/...

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: out/coverage.out
          retention-days: 7

  multiarch-build:
    name: Multi-Arch Build & Publish (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: kaniko-executor
            tags: |
              kanikorevanced/executor:latest
              kanikorevanced/executor:ai
          - target: kaniko-debug
            tags: |
              kanikorevanced/executor:debug
              kanikorevanced/executor:ai-debug
          - target: kaniko-slim
            tags: |
              kanikorevanced/executor:slim
          - target: kaniko-warmer
            tags: |
              kanikorevanced/warmer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Hub Auth
        id: auth_check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "can_push=true" >> $GITHUB_OUTPUT
          else
            echo "can_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.auth_check.outputs.can_push == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.auth_check.outputs.can_push == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ matrix.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
