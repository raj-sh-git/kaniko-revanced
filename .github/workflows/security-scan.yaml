name: Security & Vulnerability Scan

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  govulncheck:
    name: Go Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true

  trivy-scan:
    name: Trivy Repository & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  image-scan:
    name: Container Image Scan (Grype & Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local executor image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          target: kaniko-executor
          tags: kaniko-revanced/executor:scan-target
          load: true

      - name: Scan Image with Grype
        uses: anchore/scan-action@v3
        with:
          image: 'kaniko-revanced/executor:scan-target'
          fail-build: false
          severity-cutoff: high
          output-format: table

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kaniko-revanced/executor:scan-target'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
