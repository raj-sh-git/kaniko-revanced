name: Release kaniko-revanced

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Images to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_suffix: "executor"
            target: kaniko-executor
            platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
            is_default: true

          - image_suffix: "executor"
            target: kaniko-debug
            platforms: linux/amd64,linux/arm64,linux/s390x
            tag_suffix: "-debug"
            is_default: false

          - image_suffix: "executor"
            target: kaniko-slim
            platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
            tag_suffix: "-slim"
            is_default: false

          - image_suffix: "warmer"
            target: kaniko-warmer
            platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
            is_default: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Image Tags
        id: tags
        run: |
          VERSION="${{ steps.meta.outputs.tag }}"
          CLEAN_VER="${VERSION#v}"
          REPO="kanikorevanced/executor"
          WARMER_REPO="kanikorevanced/warmer"
          
          if [ "${{ matrix.image_suffix }}" = "executor" ]; then
            if [ "${{ matrix.is_default }}" = "true" ]; then
              TAGS="${REPO}:${CLEAN_VER},${REPO}:latest,${REPO}:ai"
            else
              TAG_SUF="${{ matrix.tag_suffix }}"
              CLEAN_SUF="${TAG_SUF#-}"
              if [ "${CLEAN_SUF}" = "debug" ]; then
                TAGS="${REPO}:${CLEAN_SUF}-${CLEAN_VER},${REPO}:${CLEAN_SUF},${REPO}:ai-debug"
              else
                TAGS="${REPO}:${CLEAN_SUF}-${CLEAN_VER},${REPO}:${CLEAN_SUF}"
              fi
            fi
          elif [ "${{ matrix.image_suffix }}" = "warmer" ]; then
            TAGS="${WARMER_REPO}:${CLEAN_VER},${WARMER_REPO}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        id: build-push
        with:
          context: .
          file: ./deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release & Update Docker Hub
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          CLEAN_VER="${TAG#v}"
          {
            echo "## kaniko-revanced ${TAG}"
            echo ""
            echo "### 📦 Multi-Arch Images Available on Docker Hub"
            echo "* \`kanikorevanced/executor:${CLEAN_VER}\` (or \`latest\`, \`ai\`)"
            echo "* \`kanikorevanced/executor:debug-${CLEAN_VER}\` (or \`debug\`, \`ai-debug\`)"
            echo "* \`kanikorevanced/executor:slim-${CLEAN_VER}\` (or \`slim\`)"
            echo "* \`kanikorevanced/warmer:${CLEAN_VER}\` (or \`latest\`)"
            echo ""
            echo "### 🤖 AI-Powered Build Features"
            echo "* **Pre-flight LLM validation & health checks** with non-blocking fail-open resilience."
            echo "* **Intelligent Auto-healing** (\`--llm-auto-heal\`): automatically remediates Dockerfile build errors."
            echo "* **AI Diagnostics & Optimization** (\`--llm-diagnose\`, \`--llm-diagnose-apply\`, \`--llm-lint\`)."
            echo "* **GitLab CI & CI logs protection** with native collapsible sections."
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "kaniko-revanced ${{ steps.meta.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true

      - name: Update Docker Hub Description (executor)
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: kanikorevanced/executor
          readme-filepath: ./DOCKERHUB_README.md
          short-description: "Modern, fast, secure, AI-powered container image builder in userspace (drop-in Kaniko replacement)."

      - name: Update Docker Hub Description (warmer)
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: kanikorevanced/warmer
          readme-filepath: ./DOCKERHUB_WARMER_README.md
          short-description: "Cache warmer for kaniko-revanced to pre-fetch image layers."
