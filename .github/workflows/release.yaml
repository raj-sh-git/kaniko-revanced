name: Release kaniko-revanced

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    name: Build & Publish Images to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_suffix: "executor"
            target: kaniko-executor
            platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
            is_default: true

          - image_suffix: "executor"
            target: kaniko-debug
            platforms: linux/amd64,linux/arm64,linux/s390x
            tag_suffix: "-debug"
            is_default: false

          - image_suffix: "executor"
            target: kaniko-slim
            platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
            tag_suffix: "-slim"
            is_default: false

          - image_suffix: "warmer"
            target: kaniko-warmer
            platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
            is_default: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.18.0

      - name: Compute Image Tags
        id: tags
        run: |
          VERSION="${{ steps.meta.outputs.tag }}"
          CLEAN_VER="${VERSION#v}"
          REPO="kanikorevanced/executor"
          WARMER_REPO="kanikorevanced/warmer"
          
          if [ "${{ matrix.image_suffix }}" = "executor" ]; then
            if [ "${{ matrix.is_default }}" = "true" ]; then
              TAGS="${REPO}:${CLEAN_VER},${REPO}:${VERSION},${REPO}:latest"
              PRIMARY="${REPO}:${CLEAN_VER}"
            else
              TAG_SUF="${{ matrix.tag_suffix }}"
              CLEAN_SUF="${TAG_SUF#-}"
              TAGS="${REPO}:${CLEAN_SUF}-${CLEAN_VER},${REPO}:${VERSION}${TAG_SUF},${REPO}:${CLEAN_SUF}"
              PRIMARY="${REPO}:${CLEAN_SUF}-${CLEAN_VER}"
            fi
          elif [ "${{ matrix.image_suffix }}" = "warmer" ]; then
            TAGS="${WARMER_REPO}:${CLEAN_VER},${WARMER_REPO}:${VERSION},${WARMER_REPO}:latest"
            PRIMARY="${WARMER_REPO}:${CLEAN_VER}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "primary_tag=${PRIMARY}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        id: build-push
        with:
          context: .
          file: ./deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign Container Image with Cosign
        run: |
          IMAGE_DIGEST="${{ steps.tags.outputs.primary_tag }}@${{ steps.build-push.outputs.digest }}"
          echo "Signing $IMAGE_DIGEST..."
          cosign sign --yes "$IMAGE_DIGEST"

      - name: Generate SBOM with Syft & Attest
        run: |
          IMAGE_DIGEST="${{ steps.tags.outputs.primary_tag }}@${{ steps.build-push.outputs.digest }}"
          syft "${IMAGE_DIGEST}" -o spdx-json=sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE_DIGEST"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          CLEAN_VER="${TAG#v}"
          echo "## kaniko-revanced ${TAG}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Images Available on Docker Hub" >> RELEASE_NOTES.md
          echo "- \`kanikorevanced/executor:${CLEAN_VER}\` (or \`latest\`)" >> RELEASE_NOTES.md
          echo "- \`kanikorevanced/executor:debug-${CLEAN_VER}\` (or \`debug\`)" >> RELEASE_NOTES.md
          echo "- \`kanikorevanced/executor:slim-${CLEAN_VER}\` (or \`slim\`)" >> RELEASE_NOTES.md
          echo "- \`kanikorevanced/warmer:${CLEAN_VER}\` (or \`latest\`)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Supply Chain Security" >> RELEASE_NOTES.md
          echo "All images are cryptographically signed with Cosign keyless signatures and include attached Syft SPDX SBOMs." >> RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "kaniko-revanced ${{ steps.meta.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
