name: Bi-Weekly Release Trigger

on:
  schedule:
    # Run every alternate Monday at 02:00 UTC (bi-weekly)
    # Checked via script if 14 days have passed since last release
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  check-and-trigger:
    name: Check Release Cadence & Trigger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next SemVer & Check Cadence
        id: cadence
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          echo "Latest tag found: $LATEST_TAG"

          # Get date of latest tag
          TAG_DATE=$(git log -1 --format=%ai "$LATEST_TAG" 2>/dev/null || echo "1970-01-01")
          TAG_TS=$(date -d "$TAG_DATE" +%s 2>/dev/null || date -j -f "%Y-%m-%d %H:%M:%S %z" "$TAG_DATE" +%s 2>/dev/null || echo 0)
          NOW_TS=$(date +%s)
          DIFF_DAYS=$(( (NOW_TS - TAG_TS) / 86400 ))
          echo "Days since last tag: $DIFF_DAYS"

          # Parse and increment patch version (v1.24.X -> v1.24.X+1)
          CLEAN_VER="${LATEST_TAG#v}"
          MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
          PATCH=$(echo "$CLEAN_VER" | cut -d. -f3 | cut -d- -f1)
          NEW_PATCH=$(( PATCH + 1 ))
          NEXT_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "Next candidate tag: $NEXT_TAG"
          echo "next_tag=$NEXT_TAG" >> $GITHUB_OUTPUT

          # Trigger if at least 13 days passed or manual dispatch
          if [ "$DIFF_DAYS" -ge 13 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Cadence check: Less than 14 days since last release. Skipping."
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Release Workflow
        if: steps.cadence.outputs.should_release == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yaml',
              ref: 'main',
              inputs: {
                version: '${{ steps.cadence.outputs.next_tag }}'
              }
            });
